<script type="module">
// Headless G-buffer renderer for training the learned shader. Driven by scripts/learned-data.mjs.
import * as THREE from 'three';
import { makeGBuffer, GBUFFER } from '/web/learned.js';

let renderer, gbuffer, camera, target, radius;
window.setup = async ({ mesh, albedo, box, fov, aspect, camera: cam0 }) => {
  renderer = new THREE.WebGLRenderer();
  const data = await (await fetch(mesh)).json();
  const tex = await new THREE.TextureLoader().loadAsync(albedo);
  ({ target, radius } = cam0);
  gbuffer = makeGBuffer(THREE, data, tex, box, radius);
  camera = new THREE.PerspectiveCamera(fov, aspect, 0.05, 50);
  return renderer.getContext().getExtension('EXT_color_buffer_float') !== null;
};

// Passes 0, 1 and 4 for one key camera, top row first, quantised to uint16 (normals and depth
// from -1..1, the rest from 0..1), as base64.
window.shot = ({ yaw, pitch }) => {
  const y = THREE.MathUtils.degToRad(yaw), p = THREE.MathUtils.degToRad(pitch);
  camera.position.set(target[0] + radius * Math.cos(p) * Math.sin(y), target[1] + radius * Math.sin(p), target[2] + radius * Math.cos(p) * Math.cos(y));
  camera.lookAt(...target);
  camera.updateMatrixWorld(true);
  const passes = gbuffer.read(renderer, camera, [0, 1, 4]);
  const { width: w, height: h } = GBUFFER;
  const out = new Uint16Array(w * h * 12);
  passes.forEach((buf, k) => {
    for (let r = 0; r < h; r++) for (let x = 0; x < w; x++) for (let c = 0; c < 4; c++) {
      let v = buf[((h - 1 - r) * w + x) * 4 + c];
      if (k === 1) v = (v + 1) / 2;
      out[(r * w + x) * 12 + k * 4 + c] = Math.round(Math.min(1, Math.max(0, v)) * 65535);
    }
  });
  let s = '';
  const bytes = new Uint8Array(out.buffer);
  for (let i = 0; i < bytes.length; i += 0x8000) s += String.fromCharCode.apply(null, bytes.subarray(i, i + 0x8000));
  return btoa(s);
};
</script>
