<!doctype html>
<html>
<head>
<meta charset="utf-8">
<style>html,body{margin:0;background:transparent;overflow:hidden}</style>
<script type="importmap">
{ "imports": {
  "three": "/node_modules/three/build/three.module.js",
  "three/addons/": "/node_modules/three/examples/jsm/"
} }
</script>
</head>
<body>
<script type="module">
// Headless turntable renderer. Driven from scripts/render.mjs through window.setup()/window.shot().
import * as THREE from 'three';
import { GLTFLoader } from 'three/addons/loaders/GLTFLoader.js';
import { relaxArms } from '/web/pose.js';

let renderer, scene, camera, mixer, model, clips, target, radius;

window.setup = async ({ model: url, width, height, fov, background }) => {
  renderer = new THREE.WebGLRenderer({ antialias: true, alpha: true, preserveDrawingBuffer: true });
  renderer.setPixelRatio(1);
  renderer.setSize(width, height);
  renderer.outputColorSpace = THREE.SRGBColorSpace;
  document.body.appendChild(renderer.domElement);

  scene = new THREE.Scene();
  if (background) scene.background = new THREE.Color(background);
  scene.add(new THREE.AmbientLight(0xffffff, 2.5));
  const sun = new THREE.DirectionalLight(0xffffff, 1.5);
  sun.position.set(2, 4, 3);
  scene.add(sun);

  const gltf = await new GLTFLoader().loadAsync(url);
  model = gltf.scene;
  scene.add(model);
  clips = gltf.animations;
  mixer = new THREE.AnimationMixer(model);
  model.traverse(o => {
    if (!o.isMesh) return;
    o.frustumCulled = false;
    // The outline shells don't survive the GLTF export as a proper inverted hull, so draw them
    // first without depth writes: the body paints over them and only the silhouette rim remains.
    if (o.material.name === 'Outline') {
      o.material.side = THREE.DoubleSide;
      o.material.depthWrite = false;
      o.renderOrder = -1;
    }
  });

  camera = new THREE.PerspectiveCamera(fov, width / height, 0.01, 1000);
  frame();
  return { clips: clips.map(c => ({ name: c.name, duration: c.duration })) };
};

// Fit the camera distance to the model's current bounds.
function frame() {
  model.updateMatrixWorld(true);
  const box = new THREE.Box3().setFromObject(model, true);
  const size = box.getSize(new THREE.Vector3());
  target = box.getCenter(new THREE.Vector3());
  const r = Math.max(size.y / 2, size.x / 2 / camera.aspect, size.z / 2) * 1.12;
  radius = r / Math.tan(THREE.MathUtils.degToRad(camera.fov / 2));
  return { size: size.toArray(), center: target.toArray(), radius };
}

// Pin the orbit to a given centre and distance (e.g. the still keys' camera), so every frame of an
// animation is framed identically instead of refitting to each frame's bounds.
let pinned = null;
window.pinCamera = cam => {
  pinned = cam && { target: new THREE.Vector3(...cam.target), radius: cam.radius };
};

let rest = null;

window.pose = ({ anim, time, pose }) => {
  mixer.stopAllAction();
  // Restore the bind pose so a static pose never stacks on the previous one.
  rest ??= new Map([...model.getObjectsByProperty('isBone', true)].map(b => [b, b.quaternion.clone()]));
  for (const [b, q] of rest) b.quaternion.copy(q);
  if (anim) {
    const clip = clips.find(c => c.name === anim);
    if (!clip) throw new Error(`no animation "${anim}" (have: ${clips.map(c => c.name).join(', ')})`);
    mixer.clipAction(clip).play();
  }
  mixer.setTime(time || 0);
  if (pose === 'relaxed') {
    if (anim) throw new Error('--pose relaxed is for still renders; animations already pose the arms');
    relaxArms(THREE, model);
  }
  const fitted = frame();
  if (pinned) { target = pinned.target.clone(); radius = pinned.radius; return { ...fitted, center: target.toArray(), radius }; }
  return fitted;
};

// The current pose baked into plain world-space triangles, for viewers that only need the shape
// (no textures, skeleton or animation): exactly the geometry the renders were made from.
window.exportMesh = () => {
  model.updateMatrixWorld(true);
  const position = [], index = [];
  model.traverse(o => {
    if (!o.isMesh) return;
    const pos = o.geometry.attributes.position, base = position.length / 3, v = new THREE.Vector3();
    for (let i = 0; i < pos.count; i++) {
      v.fromBufferAttribute(pos, i);
      if (o.isSkinnedMesh) o.applyBoneTransform(i, v);
      v.applyMatrix4(o.matrixWorld);
      position.push(+v.x.toFixed(4), +v.y.toFixed(4), +v.z.toFixed(4));
    }
    const idx = o.geometry.index;
    if (idx) for (let i = 0; i < idx.count; i++) index.push(base + idx.getX(i));
    else for (let i = 0; i < pos.count; i++) index.push(base + i);
  });
  // The skeleton, and each vertex's most-weighted bone, so drawings mapped onto this shape can
  // later follow its pose.
  let skeleton = null;
  const bone = [];
  model.traverse(o => {
    if (!o.isMesh) return;
    const si = o.geometry.attributes.skinIndex, sw = o.geometry.attributes.skinWeight;
    if (o.isSkinnedMesh && !skeleton) {
      const bones = o.skeleton.bones;
      skeleton = bones.map(b => ({
        name: b.name, parent: bones.indexOf(b.parent),
        pos: b.getWorldPosition(new THREE.Vector3()).toArray().map(v => +v.toFixed(4)),
      }));
    }
    for (let i = 0; i < o.geometry.attributes.position.count; i++) {
      if (!si) { bone.push(-1); continue; }
      let best = 0;
      for (let c = 1; c < 4; c++) if (sw.getComponent(i, c) > sw.getComponent(i, best)) best = c;
      bone.push(si.getComponent(i, best));
    }
  });
  return { position, index, bone, skeleton };
};

// yaw 0 = camera in front of the character (+Z), positive yaw orbits to the character's left.
// With depth: true the shot is a depth map instead: gl_FragCoord.z between the given near and far
// planes, packed into RGB by three.js (packDepthToRGB), transparent where there is no surface.
const depthMaterial = new THREE.MeshDepthMaterial({ depthPacking: THREE.RGBDepthPacking });
window.shot = ({ yaw, pitch, depth }) => {
  const y = THREE.MathUtils.degToRad(yaw), p = THREE.MathUtils.degToRad(pitch);
  camera.position.set(
    target.x + radius * Math.cos(p) * Math.sin(y),
    target.y + radius * Math.sin(p),
    target.z + radius * Math.cos(p) * Math.cos(y),
  );
  camera.lookAt(target);
  if (depth) {
    const keep = { near: camera.near, far: camera.far, bg: scene.background };
    camera.near = depth.near; camera.far = depth.far; camera.updateProjectionMatrix();
    scene.overrideMaterial = depthMaterial; scene.background = null;
    renderer.setClearColor(0x000000, 0);
    renderer.render(scene, camera);
    const url = renderer.domElement.toDataURL('image/png');
    camera.near = keep.near; camera.far = keep.far; camera.updateProjectionMatrix();
    scene.overrideMaterial = null; scene.background = keep.bg;
    return url;
  }
  renderer.render(scene, camera);
  return renderer.domElement.toDataURL('image/png');
};
</script>
</body>
</html>
