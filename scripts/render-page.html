<!doctype html>
<html>
<head>
<meta charset="utf-8">
<style>html,body{margin:0;background:transparent;overflow:hidden}</style>
<script type="importmap">
{ "imports": {
  "three": "/node_modules/three/build/three.module.js",
  "three/addons/": "/node_modules/three/examples/jsm/"
} }
</script>
</head>
<body>
<script type="module">
// Headless turntable renderer. Driven from scripts/render.mjs through window.setup()/window.shot().
import * as THREE from 'three';
import { GLTFLoader } from 'three/addons/loaders/GLTFLoader.js';

let renderer, scene, camera, mixer, model, clips, target, radius;

window.setup = async ({ model: url, width, height, fov, background }) => {
  renderer = new THREE.WebGLRenderer({ antialias: true, alpha: true, preserveDrawingBuffer: true });
  renderer.setPixelRatio(1);
  renderer.setSize(width, height);
  renderer.outputColorSpace = THREE.SRGBColorSpace;
  document.body.appendChild(renderer.domElement);

  scene = new THREE.Scene();
  if (background) scene.background = new THREE.Color(background);
  scene.add(new THREE.AmbientLight(0xffffff, 2.5));
  const sun = new THREE.DirectionalLight(0xffffff, 1.5);
  sun.position.set(2, 4, 3);
  scene.add(sun);

  const gltf = await new GLTFLoader().loadAsync(url);
  model = gltf.scene;
  scene.add(model);
  clips = gltf.animations;
  mixer = new THREE.AnimationMixer(model);
  model.traverse(o => {
    if (!o.isMesh) return;
    o.frustumCulled = false;
    // The outline shells don't survive the GLTF export as a proper inverted hull, so draw them
    // first without depth writes: the body paints over them and only the silhouette rim remains.
    if (o.material.name === 'Outline') {
      o.material.side = THREE.DoubleSide;
      o.material.depthWrite = false;
      o.renderOrder = -1;
    }
  });

  camera = new THREE.PerspectiveCamera(fov, width / height, 0.01, 1000);
  frame();
  return { clips: clips.map(c => ({ name: c.name, duration: c.duration })) };
};

// Fit the camera distance to the model's current bounds.
function frame() {
  model.updateMatrixWorld(true);
  const box = new THREE.Box3().setFromObject(model, true);
  const size = box.getSize(new THREE.Vector3());
  target = box.getCenter(new THREE.Vector3());
  const r = Math.max(size.y / 2, size.x / 2 / camera.aspect, size.z / 2) * 1.12;
  radius = r / Math.tan(THREE.MathUtils.degToRad(camera.fov / 2));
  return { size: size.toArray(), center: target.toArray() };
}

// Turn `bone` (in world space) so the direction from it to `child` points along `dir`.
function aim(bone, child, dir) {
  model.updateMatrixWorld(true);
  const from = bone.getWorldPosition(new THREE.Vector3());
  const cur = child.getWorldPosition(new THREE.Vector3()).sub(from).normalize();
  const turn = new THREE.Quaternion().setFromUnitVectors(cur, dir.clone().normalize());
  const parentWorld = bone.parent.getWorldQuaternion(new THREE.Quaternion());
  const world = bone.getWorldQuaternion(new THREE.Quaternion()).premultiply(turn);
  bone.quaternion.copy(parentWorld.invert().multiply(world));
}

const bone = name => model.getObjectByName(name) || model.getObjectByName(name.replace(':', ''));
let rest = null;

// Arms hanging at the sides with a slight outward angle and a soft elbow bend, built from the
// T-pose by aiming the Mixamo arm bones rather than hard-coding rotations.
function relax() {
  const hips = bone('mixamorig:Hips').getWorldPosition(new THREE.Vector3());
  for (const side of ['Left', 'Right']) {
    const arm = bone(`mixamorig:${side}Arm`), fore = bone(`mixamorig:${side}ForeArm`), hand = bone(`mixamorig:${side}Hand`);
    if (!arm || !fore || !hand) throw new Error(`relaxed pose needs mixamorig:${side}Arm/ForeArm/Hand bones`);
    const out = Math.sign(arm.getWorldPosition(new THREE.Vector3()).x - hips.x);
    aim(arm, fore, new THREE.Vector3(out * 0.36, -1, 0.03));
    aim(fore, hand, new THREE.Vector3(out * 0.42, -1, 0.12));
  }
}

window.pose = ({ anim, time, pose }) => {
  mixer.stopAllAction();
  // Restore the bind pose so a static pose never stacks on the previous one.
  rest ??= new Map([...model.getObjectsByProperty('isBone', true)].map(b => [b, b.quaternion.clone()]));
  for (const [b, q] of rest) b.quaternion.copy(q);
  if (anim) {
    const clip = clips.find(c => c.name === anim);
    if (!clip) throw new Error(`no animation "${anim}" (have: ${clips.map(c => c.name).join(', ')})`);
    mixer.clipAction(clip).play();
  }
  mixer.setTime(time || 0);
  if (pose === 'relaxed') {
    if (anim) throw new Error('--pose relaxed is for still renders; animations already pose the arms');
    relax();
  }
  return frame();
};

// yaw 0 = camera in front of the character (+Z), positive yaw orbits to the character's left.
window.shot = ({ yaw, pitch }) => {
  const y = THREE.MathUtils.degToRad(yaw), p = THREE.MathUtils.degToRad(pitch);
  camera.position.set(
    target.x + radius * Math.cos(p) * Math.sin(y),
    target.y + radius * Math.sin(p),
    target.z + radius * Math.cos(p) * Math.cos(y),
  );
  camera.lookAt(target);
  renderer.render(scene, camera);
  return renderer.domElement.toDataURL('image/png');
};
</script>
</body>
</html>
