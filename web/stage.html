<!doctype html>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>VRM Stage</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=M+PLUS+Rounded+1c:wght@400;700;800&display=swap">
<style>
/* Layout: one full-bleed stage; a slim control strip floats at the bottom, the credit card top-left. */
:root {
  --sky-top: #fdeef3;
  --sky-low: #f6f1fb;
  --ink: #3a2a3f;
  --ink-soft: #7a6880;
  --chip: rgba(255, 255, 255, 0.78);
  --chip-line: rgba(122, 104, 128, 0.22);
  --accent: #e8507f;
  --accent-ink: #ffffff;
  --floor: #f3d6e2;
  --font-ui: "M PLUS Rounded 1c", "Hiragino Maru Gothic ProN", "Arial Rounded MT Bold", system-ui, sans-serif;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --sky-top: #2a1d33; --sky-low: #15111c; --ink: #f6e9f3; --ink-soft: #b9a5bf;
    --chip: rgba(40, 28, 48, 0.78); --chip-line: rgba(246, 233, 243, 0.16);
    --accent: #ff7aa6; --accent-ink: #2a1020; --floor: #3a2944; color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --sky-top: #2a1d33; --sky-low: #15111c; --ink: #f6e9f3; --ink-soft: #b9a5bf;
  --chip: rgba(40, 28, 48, 0.78); --chip-line: rgba(246, 233, 243, 0.16);
  --accent: #ff7aa6; --accent-ink: #2a1020; --floor: #3a2944; color-scheme: dark;
}
html, body { height: 100%; }
[hidden] { display: none !important; }
body {
  margin: 0; overflow: hidden; font-family: var(--font-ui); color: var(--ink);
  background: linear-gradient(180deg, var(--sky-top), var(--sky-low));
}
#stage { position: fixed; inset: 0; }
#stage canvas { display: block; width: 100%; height: 100%; touch-action: none; }

.hud {
  position: fixed; z-index: 2; display: flex; gap: 8px; flex-wrap: wrap; align-items: center;
  left: max(16px, env(safe-area-inset-left, 0px)); right: max(16px, env(safe-area-inset-right, 0px));
}
#controls { bottom: calc(16px + env(safe-area-inset-bottom, 0px)); justify-content: center; }
#credit {
  top: calc(16px + env(safe-area-inset-top, 0px)); right: auto; flex-direction: column; align-items: flex-start; gap: 2px;
  padding: 10px 14px; border-radius: 14px; background: var(--chip); border: 1px solid var(--chip-line);
  backdrop-filter: blur(10px); max-width: min(320px, calc(100% - 32px));
}
#credit b { font-size: 17px; font-weight: 800; text-wrap: balance; }
#credit span { font-size: 12px; color: var(--ink-soft); }
#runhint {
  top: calc(16px + env(safe-area-inset-top, 0px)); left: auto; flex-direction: column; align-items: flex-end; gap: 6px;
  padding: 10px 12px; border-radius: 14px; background: var(--chip); border: 1px solid var(--chip-line); backdrop-filter: blur(10px);
  max-width: min(300px, calc(100% - 32px)); font-size: 12px; color: var(--ink-soft); text-align: right;
}
#runhint kbd { font: 700 11px/1 var(--font-ui); padding: 2px 5px; border-radius: 5px; border: 1px solid var(--chip-line); color: var(--ink); }
#poses { flex-wrap: nowrap; overflow-x: auto; max-width: 100%; scrollbar-width: thin; }
#poses button, #arms button { flex: none; }
#arms, #parkour { flex-wrap: nowrap; overflow-x: auto; max-width: 100%; scrollbar-width: thin; align-items: center; }
#parkour button { flex: none; }
#arms .label, #parkour .label { font-size: 12px; font-weight: 700; color: var(--ink-soft); padding: 0 6px 0 10px; flex: none; }

.group { display: flex; gap: 4px; padding: 4px; border-radius: 999px; background: var(--chip); border: 1px solid var(--chip-line); backdrop-filter: blur(10px); flex-wrap: wrap; }
button {
  font: 700 13px/1 var(--font-ui); color: var(--ink); background: transparent; border: 0;
  padding: 8px 12px; border-radius: 999px; cursor: pointer;
}
button:hover { background: var(--chip-line); }
button:focus-visible { outline: 2px solid var(--accent); outline-offset: 1px; }
button[aria-pressed="true"] { background: var(--accent); color: var(--accent-ink); }

#empty {
  position: fixed; inset: 0; z-index: 1; display: grid; place-items: center; text-align: center;
  padding-inline: max(16px, env(safe-area-inset-left, 0px)) max(16px, env(safe-area-inset-right, 0px));
}
#empty .card {
  display: grid; gap: 12px; justify-items: center; max-width: 360px; padding: 28px 24px; border-radius: 22px;
  border: 2px dashed var(--chip-line); background: var(--chip); backdrop-filter: blur(10px);
}
#empty h1 { margin: 0; font-size: 22px; font-weight: 800; text-wrap: balance; }
#empty p { margin: 0; color: var(--ink-soft); line-height: 1.55; }
#empty .open { background: var(--accent); color: var(--accent-ink); padding: 12px 20px; font-size: 15px; }
body.dragging #empty .card { border-color: var(--accent); }
#status { font-size: 13px; color: var(--ink-soft); min-height: 1.2em; }
@media (prefers-reduced-motion: reduce) { * { transition: none !important; } }
</style>

<div id="stage"></div>

<div id="empty" hidden>
  <div class="card">
    <h1>Drop a .vrm avatar here</h1>
    <p>She loads on this stage with her toon shading, swaying hair and blinking eyes. The file stays on your device.</p>
    <button class="open" id="pick" type="button">Choose a VRM file</button>
    <div id="status" role="status"></div>
  </div>
</div>

<div class="hud" id="credit" hidden><b id="name"></b><span id="author"></span><span id="motion-credit" hidden></span><span id="loadstatus" role="status"></span></div>

<div class="hud" id="runhint" hidden>
  <span><kbd>W</kbd> <kbd>A</kbd> <kbd>S</kbd> <kbd>D</kbd> or arrows to run, from the camera's view</span>
  <button type="button" id="autorun" aria-pressed="true">Auto-run a lap</button>
  <button type="button" id="physics" aria-pressed="false" title="Simulate her body (MuJoCo) and track the generated motion with the trained policy">Physics</button>
  <span id="runstatus" role="status"></span>
</div>

<div class="hud" id="controls" hidden>
  <div class="group" id="poses" aria-label="Pose and moves">
    <button type="button" data-pose="stand" aria-pressed="true">Stand</button>
    <button type="button" data-pose="tpose" aria-pressed="false">T-pose</button>
  </div>
  <div class="group" id="arms" aria-label="Arms from">
    <span class="label">Arms</span>
    <button type="button" data-arms="same" aria-pressed="true">Same</button>
  </div>
  <div class="group" id="parkour" aria-label="Parkour">
    <span class="label">Parkour</span>
    <button type="button" data-pose="free:run" aria-pressed="false">Free run</button>
  </div>
  <div class="group" id="faces" aria-label="Expression"></div>
  <div class="group">
    <button type="button" id="spin" aria-pressed="true">Turntable</button>
    <button type="button" id="reset">Reset view</button>
    <button type="button" id="avatar" aria-pressed="false" title="Switch between the box character and the VRoid avatar">VRoid avatar</button>
    <button type="button" id="other">Open…</button>
  </div>
</div>
<input type="file" id="file" accept=".vrm,.glb" hidden>

<script type="importmap">
{ "imports": {
  "three": "https://cdn.jsdelivr.net/npm/three@0.170.0/build/three.module.js",
  "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.170.0/examples/jsm/",
  "@pixiv/three-vrm": "https://cdn.jsdelivr.net/npm/@pixiv/three-vrm@3.5.5/lib/three-vrm.module.min.js",
  "@pixiv/three-vrm-animation": "https://cdn.jsdelivr.net/npm/@pixiv/three-vrm-animation@3.5.5/lib/three-vrm-animation.module.min.js"
} }
</script>
<script type="module">
// A live VRM stage: orbit around the avatar with MToon shading, spring-bone hair and skirt, an idle
// sway, blinking, eyes that follow the camera, and buttons for pose, mocap moves and expression.
// The moves come from vrmanet (vrmanet.js + vrmanet.wasm): a motion network whose weights are the
// VRM Animation file moves/vrmanet.vrma, one expert per CMU mocap clip. The Moves row picks the
// expert for the whole body, the Arms row can route the arms to another; the network's state-space
// controller crossfades between them.
// Loads ?model=<url>, else stock.vrm.png beside the page (a VRM packed into a PNG by
// coverage/live/slim_vrm.py, for hosts that serve images but not model files), else the stock
// avatar in out/stock/ when served from the repo (npm run viewer, then /web/stage.html), else
// waits for a dropped or chosen file.
import * as THREE from 'three';
import { GLTFLoader } from 'three/addons/loaders/GLTFLoader.js';
import { OrbitControls } from 'three/addons/controls/OrbitControls.js';
import { VRMLoaderPlugin, VRMUtils, VRMHumanoid } from '@pixiv/three-vrm';
import { createBoxCharacter } from './boxchar.js';
import { VRMAnimationLoaderPlugin, createVRMAnimationClip } from '@pixiv/three-vrm-animation';
import { createVrmanet } from './vrmanet.js';
import { createFreeRun, COURSE } from './freerun.js';

// The experts' button labels, in this order.
const MOVES = {
  wave: 'Wave', bow: 'Grand bow', stretch: 'Stretch & yawn', walk: 'Walk', shywalk: 'Shy walk', coolwalk: 'Cool walk',
  moonwalk: 'Moonwalk', twist: 'Twist', charleston: 'Charleston', dance: 'Ballet', jacks: 'Jumping jacks',
};
for (const [name, label] of Object.entries(MOVES)) {
  for (const [row, attr] of [['poses', 'pose'], ['arms', 'arms']]) {
    const b = document.createElement('button');
    b.type = 'button'; b.dataset[attr] = attr === 'pose' ? `clip:${name}` : name; b.textContent = label;
    b.setAttribute('aria-pressed', 'false');
    document.getElementById(row).append(b);
  }
}

// The network: its runtime and its weights. Hosts that serve images but not glTF get the weights
// packed into a PNG (moves/vrmanet.vrma.png).
let net = null, armsMove = 'same', active = new Set();
(async () => {
  const wasm = await (await fetch('vrmanet.wasm')).arrayBuffer();
  const res = await fetch('moves/vrmanet.vrma').catch(() => null);
  const weights = res?.ok ? await res.arrayBuffer() : await unpackPng('moves/vrmanet.vrma.png');
  return createVrmanet(wasm, weights);
})().then(n => {
  net = n;
  document.getElementById('motion-credit').textContent = n.credit.replace(/ \(.*$/, '');
  for (const b of document.querySelectorAll('[data-pose^="clip:"], [data-arms]')) {
    const name = b.dataset.arms || b.dataset.pose.slice(5);
    if (name !== 'same' && !n.experts.includes(name)) b.disabled = true;
  }
  if (pose.startsWith('clip:')) setPose(pose);
}, e => {
  console.error('vrmanet', e);
  for (const b of document.querySelectorAll('[data-pose^="clip:"], [data-arms]')) b.disabled = true;
});

const $ = id => document.getElementById(id);
const stage = $('stage');
const renderer = new THREE.WebGLRenderer({ antialias: true, alpha: true });
renderer.setPixelRatio(Math.min(devicePixelRatio, 2));
renderer.outputColorSpace = THREE.SRGBColorSpace;
stage.appendChild(renderer.domElement);

const scene = new THREE.Scene();
// One white key light at intensity PI and no ambient: MToon's own shade colours do the fill, and
// skin and hair then match VRoid Studio's render of her (its thumbnail) to within a few levels.
// Like VRoid Studio's preview, the light stays over the viewer's right shoulder as they orbit.
const sun = new THREE.DirectionalLight(0xffffff, Math.PI);
const keyDir = new THREE.Vector3(1, 1, 1).normalize();
scene.add(sun, sun.target);

// A soft round shadow under her feet, so she stands on something.
const floorTex = (() => {
  const c = document.createElement('canvas'); c.width = c.height = 256;
  const g = c.getContext('2d'), grad = g.createRadialGradient(128, 128, 0, 128, 128, 128);
  grad.addColorStop(0, 'rgba(255,255,255,1)'); grad.addColorStop(0.55, 'rgba(255,255,255,0.55)'); grad.addColorStop(1, 'rgba(255,255,255,0)');
  g.fillStyle = grad; g.fillRect(0, 0, 256, 256);
  return new THREE.CanvasTexture(c);
})();
const floor = new THREE.Mesh(new THREE.CircleGeometry(0.9, 48), new THREE.MeshBasicMaterial({ map: floorTex, transparent: true, depthWrite: false }));
floor.rotation.x = -Math.PI / 2;
scene.add(floor);
const paintFloor = () => floor.material.color.set(getComputedStyle(document.documentElement).getPropertyValue('--floor').trim() || '#f3d6e2');
paintFloor();
matchMedia('(prefers-color-scheme: dark)').addEventListener('change', paintFloor);
new MutationObserver(paintFloor).observe(document.documentElement, { attributes: true, attributeFilter: ['data-theme'] });

const camera = new THREE.PerspectiveCamera(28, 1, 0.05, 50);
const controls = new OrbitControls(camera, renderer.domElement);
controls.enableDamping = true;
controls.autoRotate = true;
controls.autoRotateSpeed = 1.2;
controls.minDistance = 0.4;
controls.maxDistance = 8;
const home = { pos: new THREE.Vector3(0, 1.1, 4.2), target: new THREE.Vector3(0, 0.85, 0) };
const resetView = () => { camera.position.copy(home.pos); controls.target.copy(home.target); controls.update(); };
resetView();

const resize = () => {
  const { clientWidth: w, clientHeight: h } = stage;
  renderer.setSize(w, h, false);
  camera.aspect = w / h;
  camera.updateProjectionMatrix();
};
addEventListener('resize', resize);
resize();

let vrm = null, pose = 'stand', face = null;
const bone = n => vrm.humanoid.getNormalizedBoneNode(n);

// A file packed into an RGB PNG as coverage/live/slim_vrm.py does: a 4-byte length, then the bytes.
async function unpackPng(url) {
  const res = await fetch(url);
  if (!res.ok) throw new Error(`${res.status}`);
  const bmp = await createImageBitmap(await res.blob(), { colorSpaceConversion: 'none', premultiplyAlpha: 'none' });
  const ctx = new OffscreenCanvas(bmp.width, bmp.height).getContext('2d');
  ctx.drawImage(bmp, 0, 0);
  const px = ctx.getImageData(0, 0, bmp.width, bmp.height).data;
  const rgb = new Uint8Array(bmp.width * bmp.height * 3);
  for (let i = 0, j = 0; i < px.length; i += 4) { rgb[j++] = px[i]; rgb[j++] = px[i + 1]; rgb[j++] = px[i + 2]; }
  const n = rgb[0] | (rgb[1] << 8) | (rgb[2] << 16) | (rgb[3] << 24);
  return rgb.buffer.slice(4, 4 + n);
}

const say = m => { $('loadstatus').textContent = m; $('status').textContent = m; };

// A VRM file. src: a URL, or the file's bytes.
async function load(src, label) {
  say(`Loading ${label}…`);
  const loader = new GLTFLoader();
  loader.register(parser => new VRMLoaderPlugin(parser));
  let gltf;
  try { gltf = typeof src === 'string' ? await loader.loadAsync(src) : await loader.parseAsync(src, ''); }
  catch (e) { say(`Could not open ${label}: ${e.message || e}. Pick a .vrm file exported from VRoid or similar.`); return false; }
  const next = gltf.userData.vrm;
  if (!next) { say(`${label} is a glTF without VRM data. Pick a .vrm file.`); return false; }
  VRMUtils.removeUnnecessaryVertices(gltf.scene);
  VRMUtils.combineSkeletons(gltf.scene);
  VRMUtils.rotateVRM0(vrm = install(next));
  finish(label);
  $('avatar').setAttribute('aria-pressed', 'true');
  return true;
}

// The built-in box character (boxchar.js), the default.
function loadBox() {
  vrm = install(createBoxCharacter(THREE, VRMHumanoid));
  finish('Box character');
  $('avatar').setAttribute('aria-pressed', 'false');
}

// Swap the character in: whatever moves the old one stops first.
function install(next) {
  if (pose.startsWith('parc:') || pose === 'free:run') setPose('stand');
  if (vrm) { scene.remove(vrm.scene); VRMUtils.deepDispose(vrm.scene); }
  return next;
}

function finish(label) {
  vrm.scene.traverse(o => { o.frustumCulled = false; });
  scene.add(vrm.scene);
  if (vrm.lookAt) vrm.lookAt.target = camera;

  // Frame her: look at mid-height, back off far enough for her full height.
  const box = new THREE.Box3().setFromObject(vrm.scene);
  const size = box.getSize(new THREE.Vector3()), mid = box.getCenter(new THREE.Vector3());
  const dist = size.y * 0.62 / Math.tan(THREE.MathUtils.degToRad(camera.fov / 2));
  home.target.set(mid.x, mid.y, mid.z);
  home.pos.set(mid.x, mid.y + size.y * 0.08, mid.z + dist);
  floor.position.set(mid.x, box.min.y + 0.001, mid.z);
  floor.scale.setScalar(Math.max(size.x, size.z) * 1.6 + 0.2);
  resetView();

  const meta = vrm.meta || {};
  $('name').textContent = (meta.name || meta.title || label).trim();
  const who = meta.authors?.join(', ') || meta.author;
  $('author').textContent = who ? `by ${who}` : '';
  $('credit').hidden = false;

  const names = vrm.expressionManager ? Object.keys(vrm.expressionManager.expressionMap) : [];
  const wanted = ['happy', 'relaxed', 'surprised', 'sad', 'angry'].filter(n => names.includes(n));
  $('faces').replaceChildren(...['neutral', ...wanted].map(n => {
    const b = document.createElement('button');
    b.type = 'button'; b.dataset.face = n; b.textContent = n[0].toUpperCase() + n.slice(1);
    b.setAttribute('aria-pressed', String(n === 'neutral'));
    return b;
  }));
  $('faces').hidden = !wanted.length;
  face = null;

  // Settle the springs in the stand before showing her, so the hair doesn't fall in from the T-pose.
  if (pose.startsWith('clip:')) pose = 'stand';
  setPose(pose);
  for (let i = 0; i < 120; i++) { applyPose(i / 60); vrm.update(1 / 60); }
  $('empty').hidden = true;
  $('controls').hidden = false;
  say('');
}

function setPose(p) {
  const fresh = !pose.startsWith('clip:') || !active.size;
  if (pose.startsWith('parc:') && p !== pose) stopParkour();
  if (pose === 'free:run' && p !== pose) stopFree();
  pose = p;
  for (const b of document.querySelectorAll('[data-pose]')) b.setAttribute('aria-pressed', String(b.dataset.pose === p));
  $('motion-credit').hidden = !p.startsWith('clip:') || !net;
  if (p.startsWith('clip:')) drive(fresh);
  else active = new Set();
  if (p.startsWith('parc:')) startParkour(p.slice(5));
  if (p === 'free:run') startFree();
}

// Free run: PARC's motion generator (parcgen.wasm, weights parcgen.bin) moves her live over a
// course, steered by the keys or round an auto-run lap (freerun.js).
const fr = { run: null, assets: null, physicsAssets: null, physics: false, auto: true, keys: new Set() };
window.freeRun = fr;   // for tests: fr.run.root() is where she is
async function freeAssets() {
  fr.assets ??= (async () => {
    const wasm = await (await fetch('parcgen.wasm')).arrayBuffer();
    const res = await fetch('parcgen.bin').catch(() => null);
    const weights = res?.ok ? await res.arrayBuffer() : await unpackPng('parcgen.bin.png');
    const start = (await (await fetch('parcgen-start.json')).json()).frames.map(f => Float32Array.from(f));
    return { wasm, weights, start };
  })();
  return fr.assets;
}
// Physics: MuJoCo (WASM), the humanoid model and the trained tracker (physics/export.py).
async function physicsAssets() {
  fr.physicsAssets ??= (async () => {
    const mujoco = await (await import('./mujoco/mujoco.js')).default();
    const xml = await (await fetch('physics/humanoid.xml')).text();
    const info = await (await fetch('physics/tracker.json')).json();
    const res = await fetch('physics/tracker.bin').catch(() => null);
    const weights = res?.ok ? await res.arrayBuffer() : await unpackPng('physics/tracker.bin.png');
    return { mujoco, xml, info, weights };
  })();
  return fr.physicsAssets;
}
async function startFree() {
  $('runhint').hidden = false;
  $('runstatus').textContent = 'Loading the motion generator (9 MB)…';
  controls.autoRotate = false;
  $('spin').setAttribute('aria-pressed', 'false');
  let a, ph = null;
  try { a = await freeAssets(); } catch (e) { $('runstatus').textContent = `Could not load the generator: ${e.message}`; return; }
  if (fr.physics) {
    $('runstatus').textContent = 'Loading the physics (MuJoCo, 11 MB)…';
    try { ph = await physicsAssets(); } catch (e) { $('runstatus').textContent = `Physics unavailable (${e.message}); running without it`; }
  }
  if (pose !== 'free:run' || fr.run) return;
  const run = await createFreeRun({ THREE, scene, vrm, wasm: a.wasm.slice(0), weights: a.weights.slice(0), start: a.start,
    physics: ph && { mujoco: ph.mujoco, xml: ph.xml, info: ph.info, weights: ph.weights },
    onStatus: m => { $('runstatus').textContent = m; } }).catch(e => { $('runstatus').textContent = `Generator failed: ${e.message}`; });
  if (!run) return;
  if (pose !== 'free:run') { run.dispose(); return; }
  fr.run = run;
  floor.visible = false;
  // Start behind her and to the side, looking along her first stretch (+x in PARC's frame).
  const spawn = run.toVrm(COURSE.spawn[0], COURSE.spawn[1], 0.9);
  controls.target.copy(spawn);
  camera.position.copy(spawn).add(run.toVrm(-5, -7, 3));
  controls.update();
  $('motion-credit').textContent = 'Motion: PARC generator (Xu et al. 2025)';
  $('motion-credit').hidden = false;
}
function stopFree() {
  fr.run?.dispose();
  fr.run = null;
  $('runhint').hidden = true;
  floor.visible = true;
  resetView();
}
// The keys as a direction on the ground, relative to the camera, in PARC's frame (x = VRM z, y = VRM x).
function keysDir() {
  const f = camera.getWorldDirection(new THREE.Vector3()).setY(0).normalize(), k = fr.keys;
  const fwd = (k.has('KeyW') || k.has('ArrowUp') ? 1 : 0) - (k.has('KeyS') || k.has('ArrowDown') ? 1 : 0);
  const right = (k.has('KeyD') || k.has('ArrowRight') ? 1 : 0) - (k.has('KeyA') || k.has('ArrowLeft') ? 1 : 0);
  const vx = f.x * fwd - f.z * right, vz = f.z * fwd + f.x * right, n = Math.hypot(vx, vz);
  return n > 0 ? [vz / n, vx / n] : [0, 0];
}
const RUN_KEYS = new Set(['KeyW', 'KeyA', 'KeyS', 'KeyD', 'ArrowUp', 'ArrowDown', 'ArrowLeft', 'ArrowRight']);
addEventListener('keydown', e => {
  if (pose !== 'free:run' || !RUN_KEYS.has(e.code)) return;
  e.preventDefault();
  fr.keys.add(e.code);
  if (fr.auto) { fr.auto = false; $('autorun').setAttribute('aria-pressed', 'false'); }
});
addEventListener('keyup', e => fr.keys.delete(e.code));
addEventListener('blur', () => fr.keys.clear());

// Parkour previews: PARC dataset motions as VRMA clips that travel over their own terrain
// (parkour/<name>.vrma and .json, listed in parkour/index.json; made by parkour/export.py).
const pk = { mixer: null, terrain: null, credit: '' };
const vrmaLoader = new GLTFLoader();
vrmaLoader.register(parser => new VRMAnimationLoaderPlugin(parser));
const loadVrma = url => vrmaLoader.loadAsync(url).catch(async () => vrmaLoader.parseAsync(await unpackPng(`${url}.png`), ''));
fetch('parkour/index.json').then(r => (r.ok ? r.json() : null)).then(ix => {
  if (!ix) return;
  pk.credit = ix.credit;
  for (const name of ix.clips) {
    const b = document.createElement('button');
    b.type = 'button'; b.dataset.pose = `parc:${name}`; b.textContent = ix.labels?.[name] || name; b.setAttribute('aria-pressed', 'false');
    $('parkour').append(b);
  }
}).catch(() => {});

async function startParkour(name) {
  const [gltf, ground] = await Promise.all([loadVrma(`parkour/${name}.vrma`), fetch(`parkour/${name}.json`).then(r => r.json())]);
  if (pose !== `parc:${name}` || !vrm) return;
  stopParkour();
  const anim = gltf.userData.vrmAnimations[0];
  const clip = createVRMAnimationClip(anim, vrm);
  pk.mixer = new THREE.AnimationMixer(vrm.scene);
  pk.mixer.clipAction(clip).play();
  // The player scales the hips' path by hip height; the terrain gets the same scale.
  const s = vrm.humanoid.normalizedRestPose.hips.position[1] / anim.restHipsPosition.y;
  // Watch from the side of her path, pulled back: where she starts, and the way she goes. Terrain can
  // hide her (a wall she climbs, a pit she crosses): of eight directions round that view, take the one
  // that needs the camera least high to see over the terrain all along her path, and raise it that much.
  const hipsAt = t => { pk.mixer.setTime(t); vrm.scene.updateMatrixWorld(true); return vrm.humanoid.getNormalizedBoneNode('hips').getWorldPosition(new THREE.Vector3()); };
  const path = Array.from({ length: 12 }, (_, i) => hipsAt(clip.duration * 0.999 * i / 11));
  const start = path[0], along = path[11].clone().sub(start).setY(0);
  const side = along.lengthSq() > 1e-4 ? new THREE.Vector3(along.z, 0, -along.x).normalize() : new THREE.Vector3(1, 0, 0);
  const R = 5.7, view = side.clone().multiplyScalar(5.5).addScaledVector(along.normalize(), -1.5).normalize();
  const height = (x, z) => (ground.heights[Math.round((z / s - ground.z0) / ground.cell)]?.[Math.round((x / s - ground.x0) / ground.cell)] ?? -Infinity) * s;
  // The steepest rise of the terrain over her, seen from that way (off the map is open).
  const rise = dir => Math.max(0, ...path.flatMap(p => [0.5, 1, 1.5, 2, 3, 4, 5].map(d => (height(p.x + dir.x * d, p.z + dir.z * d) - p.y + 0.3) / d)));
  const ways = [0, 1, -1, 2, -2, 3, -3, 4].map(k => view.clone().applyAxisAngle(new THREE.Vector3(0, 1, 0), k * Math.PI / 4));
  const best = ways.reduce((a, b) => (rise(b) < rise(a) - 0.05 ? b : a));
  controls.target.copy(start);
  camera.position.copy(start).addScaledVector(best, R).add(new THREE.Vector3(0, Math.min(Math.max(1.6, rise(best) * R), R * 1.5), 0));
  controls.update();
  pk.terrain = buildTerrain(ground, s);
  scene.add(pk.terrain);
  floor.visible = false;
  controls.autoRotate = false;
  $('spin').setAttribute('aria-pressed', 'false');
  $('motion-credit').textContent = pk.credit.replace(/ \(.*$/, '');
  $('motion-credit').hidden = false;
}

function stopParkour() {
  pk.mixer?.stopAllAction();
  pk.mixer = null;
  if (pk.terrain) { scene.remove(pk.terrain); pk.terrain.geometry.dispose(); pk.terrain.material.dispose(); pk.terrain = null; }
  floor.visible = true;
  vrm?.humanoid.resetNormalizedPose();
  resetView();
}

// The heightfield as stone columns, one per sample (heights[i][j] at x = x0 + j cell, z = z0 + i cell).
function buildTerrain({ heights, x0, z0, cell }, s) {
  const rows = heights.length, cols = heights[0].length, all = heights.flat();
  const lo = Math.min(...all), hi = Math.max(...all), base = (lo - 0.3) * s;
  const mesh = new THREE.InstancedMesh(new THREE.BoxGeometry(1, 1, 1), new THREE.MeshLambertMaterial({ emissive: '#5f5660' }), rows * cols);
  // The stage has one key light and no ambient (MToon's own shade colours fill her); the stone glows a
  // little so faces turned from the light read as shade, not as holes.
  const m = new THREE.Matrix4(), c = new THREE.Color(), low = new THREE.Color('#b9adb6'), high = new THREE.Color('#efe6ea');
  let k = 0;
  for (let i = 0; i < rows; i++) for (let j = 0; j < cols; j++) {
    const top = heights[i][j] * s, h = Math.max(top - base, 0.01);
    m.makeScale(cell * s * 0.985, h, cell * s * 0.985).setPosition((x0 + j * cell) * s, base + h / 2, (z0 + i * cell) * s);
    mesh.setMatrixAt(k, m);
    mesh.setColorAt(k++, c.copy(low).lerp(high, hi > lo ? (heights[i][j] - lo) / (hi - lo) : 1));
  }
  return mesh;
}

// Point the network at the chosen experts: the pressed move for the body, the Arms row's for the
// arms. Starting from a still pose it begins at full weight; between moves its controller fades.
// An expert that joins starts its clip from the top; one already playing keeps its place.
function drive(fresh) {
  if (!net) return;
  const body = pose.slice(5), arms = armsMove === 'same' ? body : armsMove;
  net.control({ [body]: 1 }, { [arms]: 1 });
  if (fresh) { net.reset(); net.steady(); }
  for (const n of new Set([body, arms])) if (fresh || !active.has(n)) net.trigger(n);
  active = new Set([body, arms]);
}

// The pose at time t (seconds) when no move is playing: the bind T-pose, or arms down with a slow
// breath and sway.
function applyPose(t) {
  vrm.humanoid.resetNormalizedPose();
  if (pose === 'tpose') return;
  const breath = Math.sin(t * 1.6), sway = Math.sin(t * 0.7);
  bone('spine').rotation.x = 0.02 * breath;
  bone('chest') && (bone('chest').rotation.x = 0.015 * breath);
  bone('hips').rotation.y = 0.04 * sway;
  bone('spine').rotation.z = 0.02 * sway;
  bone('neck') && (bone('neck').rotation.z = -0.03 * sway);
  bone('leftUpperArm').rotation.z = -1.19 + 0.03 * breath;
  bone('leftLowerArm').rotation.z = -0.15;
  bone('rightUpperArm').rotation.z = 1.19 - 0.03 * breath;
  bone('rightLowerArm').rotation.z = 0.15;
}

// Blink every few seconds, skipped while an expression that closes the eyes is on.
let nextBlink = 2, blinkStart = -1;
function blink(t) {
  const em = vrm.expressionManager;
  if (!em) return;
  if (blinkStart < 0 && t > nextBlink) blinkStart = t;
  let v = 0;
  if (blinkStart >= 0) {
    const k = (t - blinkStart) / 0.16;
    v = k < 1 ? Math.sin(k * Math.PI) : 0;
    if (k >= 1) { blinkStart = -1; nextBlink = t + 2 + Math.random() * 3; }
  }
  em.setValue('blink', face === 'happy' || face === 'relaxed' ? 0 : v);
}

function setFace(n) {
  const em = vrm.expressionManager;
  for (const b of $('faces').children) b.setAttribute('aria-pressed', String(b.dataset.face === n));
  for (const k of ['happy', 'relaxed', 'surprised', 'sad', 'angry']) if (em.getExpression(k)) em.setValue(k, 0);
  face = n === 'neutral' ? null : n;
  if (face) em.setValue(face, 1);
}

const clock = new THREE.Clock();
renderer.setAnimationLoop(() => {
  const dt = Math.min(clock.getDelta(), 1 / 20), t = clock.elapsedTime;
  if (vrm) {
    if (pose === 'free:run') {
      if (fr.run) {
        fr.run.update(dt, fr.auto ? null : keysDir());
        const move = fr.run.hips().clone().sub(controls.target).multiplyScalar(Math.min(1, dt * 3));
        controls.target.add(move);
        camera.position.add(move);
      }
    } else if (pose.startsWith('parc:')) {
      if (pk.mixer) {
        pk.mixer.update(dt);
        // Follow her: the camera keeps its offset from a target that eases toward her hips.
        const hips = vrm.humanoid.getNormalizedBoneNode('hips').getWorldPosition(new THREE.Vector3());
        const move = hips.sub(controls.target).multiplyScalar(Math.min(1, dt * 4));
        controls.target.add(move);
        camera.position.add(move);
      }
    } else if (!pose.startsWith('clip:')) applyPose(t);
    else if (net) { net.step(dt); vrm.humanoid.resetNormalizedPose(); net.apply(vrm); }
    blink(t);
    vrm.update(dt);
  }
  controls.update(dt);
  sun.target.position.copy(controls.target);
  sun.position.copy(keyDir).applyQuaternion(camera.quaternion).add(controls.target);
  renderer.render(scene, camera);
});

$('poses').addEventListener('click', e => { const p = e.target.dataset?.pose; if (p && vrm) setPose(p); });
$('parkour').addEventListener('click', e => { const p = e.target.dataset?.pose; if (p && vrm) setPose(p); });
$('faces').addEventListener('click', e => { const f = e.target.dataset?.face; if (f && vrm) setFace(f); });
$('arms').addEventListener('click', e => {
  const a = e.target.dataset?.arms;
  if (!a) return;
  armsMove = a;
  for (const b of $('arms').querySelectorAll('button')) b.setAttribute('aria-pressed', String(b.dataset.arms === a));
  if (pose.startsWith('clip:')) drive(false);
});
$('physics').addEventListener('click', () => {
  fr.physics = !fr.physics;
  $('physics').setAttribute('aria-pressed', String(fr.physics));
  if (pose === 'free:run') { stopFree(); startFree(); }
});
$('autorun').addEventListener('click', () => {
  fr.auto = !fr.auto;
  $('autorun').setAttribute('aria-pressed', String(fr.auto));
});
$('spin').addEventListener('click', () => {
  controls.autoRotate = !controls.autoRotate;
  $('spin').setAttribute('aria-pressed', String(controls.autoRotate));
});
$('reset').addEventListener('click', resetView);
renderer.domElement.addEventListener('pointerdown', () => {
  if (!controls.autoRotate) return;
  controls.autoRotate = false;
  $('spin').setAttribute('aria-pressed', 'false');
});

const openFile = async file => {
  if (!file) return;
  const url = URL.createObjectURL(file);
  await load(url, file.name);
  URL.revokeObjectURL(url);
};
$('pick').addEventListener('click', () => $('file').click());
$('other').addEventListener('click', () => $('file').click());
$('file').addEventListener('change', e => { openFile(e.target.files[0]); e.target.value = ''; });
addEventListener('dragover', e => { e.preventDefault(); document.body.classList.add('dragging'); $('empty').hidden = false; });
addEventListener('dragleave', e => { if (!e.relatedTarget) { document.body.classList.remove('dragging'); $('empty').hidden = true; } });
addEventListener('drop', e => { e.preventDefault(); document.body.classList.remove('dragging'); $('empty').hidden = true; openFile(e.dataTransfer.files[0]); });

// The VRoid avatar, on request: stock.vrm.png beside the page, else the stock avatar in out/stock/.
async function loadVroid() {
  say('Loading the VRoid avatar…');
  const local = '../out/stock/stock_avatar.vrm';
  const ok = await unpackPng('stock.vrm.png').then(buf => load(buf, 'stock avatar'),
    () => fetch(local, { method: 'HEAD' }).then(r => r.ok && load(local, 'stock_avatar.vrm')).catch(() => false));
  if (!ok) say('No VRoid avatar here: open or drop a .vrm file');
}
$('avatar').addEventListener('click', () => ($('avatar').getAttribute('aria-pressed') === 'true' ? loadBox() : loadVroid()));

// Start with the box character, or the model named in ?model=.
const asked = new URLSearchParams(location.search).get('model');
loadBox();
if (asked) load(asked, asked.split('/').pop());
</script>
