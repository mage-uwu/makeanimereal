<style>

}
@media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) {
  --stage-top: #0e1030; --stage-bottom: #1d2052;
  --ink: #eef0ff; --muted: #a3a8dc; --gold: #e2bd62; --chip: rgba(20,22,60,.72); --line: rgba(238,240,255,.16); color-scheme: dark } }
:root[data-theme="dark"] {
  --stage-top: #0e1030; --stage-bottom: #1d2052;
  --ink: #eef0ff; --muted: #a3a8dc; --gold: #e2bd62; --chip: rgba(20,22,60,.72); --line: rgba(238,240,255,.16); color-scheme: dark }

  -webkit-user-select: none; user-select: none; -webkit-tap-highlight-color: transparent; }
.app { height: 100%; height: 100dvh; display: grid; grid-template-rows: auto 1fr auto; background: linear-gradient(var(--stage-top), var(--stage-bottom)); }
header { padding: max(10px, env(safe-area-inset-top, 0px)) max(16px, env(safe-area-inset-right, 0px)) 0 max(16px, env(safe-area-inset-left, 0px)); }

.chips { display: flex; gap: 6px; overflow-x: auto; scrollbar-width: none; -webkit-overflow-scrolling: touch;
  padding: 2px max(16px, env(safe-area-inset-right, 0px)) 2px max(16px, env(safe-area-inset-left, 0px)); }

  border-radius: 999px; padding: 8px 14px; min-height: 36px; cursor: pointer; touch-action: manipulation; }
button[aria-pressed="true"] { border-color: var(--gold); color: var(--gold); }

  border-radius: 999px; padding: 7px 14px; -webkit-user-select: text; user-select: text; }

  padding: 0 max(16px, env(safe-area-inset-right, 0px)) 0 max(16px, env(safe-area-inset-left, 0px));

</style>

<div class="app">
  <header>
    <h1>Tree-SSM Shader</h1>
    <p class="hint">Drawn every frame by the nanotss (Tree-SSM) shader: on the GPU in WebGL2, or on the CPU in WebAssembly. Drag to orbit, pinch to zoom, double-tap to reset. Follow, Mic and Speak make her a VTuber.
      Motion: <a href="https://github.com/BandaiNamcoResearchInc/Bandai-Namco-Research-Motiondataset">Bandai Namco Research</a> (CC BY-NC 4.0).</p>
  </header>

<script type="importmap">
{ "imports": {
  "three": "https://cdn.jsdelivr.net/npm/three@0.170.0/build/three.module.js",
  "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.170.0/examples/jsm/",
  "@pixiv/three-vrm": "https://cdn.jsdelivr.net/npm/@pixiv/three-vrm@3.5.5/lib/three-vrm.module.min.js"
} }
</script>
<script type="module">
// The nanotss (Tree-SSM) shader on its own, two engines for the same network. GPU (the default):
// three.js draws the G-buffer (colour, normal, depth, UV and part) into render targets and nts-gl.js
// runs the network in WebGL2 fragment shaders on the same context, then draws the result. CPU (#cpu,
// or where WebGL2 can't render to float targets): the G-buffer is drawn into a hidden canvas, read
// back, and the network runs in WebAssembly workers (nts.js); a 2D canvas shows it. No WebGPU, so it
// behaves the same on phones. Same model, camera, mocap and encodings as index.html.
import * as THREE from 'three';
import { GLTFLoader } from 'three/addons/loaders/GLTFLoader.js';
import { VRMLoaderPlugin, VRMUtils } from '@pixiv/three-vrm';
import { createMotion } from './motion.js';
import { createCpuShader } from './nts.js';
import { createGlShader } from './nts-gl.js';

// The network's frame: the training frames' scale (360 x 640) on a larger canvas, so raised arms fit.
// #tight: the training frame itself (the checks compare against it).
const TRAIN_H = 640, [NW, NH] = location.hash.includes('tight') ? [360, 640] : [720, 800], FOV = 30, ARM_DROP = 68, GREEN = 0x00b140;
const ENGINE = location.hash.includes('cpu') ? 'cpu' : 'gpu';
const VIEW_FOV = THREE.MathUtils.radToDeg(2 * Math.atan(Math.tan(THREE.MathUtils.degToRad(FOV / 2)) * NH / TRAIN_H));
const CROP_PAD = 32;
const status = document.getElementById('status'), readout = document.getElementById('readout');
const stage = document.getElementById('stage'), view = document.getElementById('view');
// GPU: three.js and the network share the visible canvas (the G-buffer goes to multisampled render
// targets). CPU: three.js draws into a hidden canvas and the visible one is 2D.
const glCanvas = ENGINE === 'gpu' ? view : document.createElement('canvas');
const ctx = ENGINE === 'cpu' ? view.getContext('2d') : null;
const renderer = new THREE.WebGLRenderer({ canvas: glCanvas, antialias: ENGINE === 'cpu', alpha: false, powerPreference: 'high-performance' });
renderer.setPixelRatio(1);
if (ENGINE === 'cpu') renderer.setSize(NW * 5, NH, false);
renderer.outputColorSpace = THREE.SRGBColorSpace;
const gl = renderer.getContext();
glCanvas.addEventListener('webglcontextlost', e => { e.preventDefault(); status.hidden = false; status.textContent = 'graphics context lost: reloading…'; });
glCanvas.addEventListener('webglcontextrestored', () => location.reload());

// ---------- the model, lit as in the coverage renders ----------
const scene = new THREE.Scene();
scene.add(new THREE.AmbientLight(0xffffff, 1.2));
const sun = new THREE.DirectionalLight(0xffffff, 2.2);
sun.position.set(1, 3, 2);
scene.add(sun);
const camera = new THREE.PerspectiveCamera(VIEW_FOV, NW / NH, 0.01, 100);
let vrm, target, radius, bones = [], motions = null, motion = null;

// The model ships as bytes packed into an opaque RGB PNG: 3 bytes a pixel after a 4-byte length.
async function unpackPng(url) {
  const bmp = await createImageBitmap(await (await fetch(url)).blob());
  const c = document.createElement('canvas'); c.width = bmp.width; c.height = bmp.height;
  const g = c.getContext('2d', { willReadFrequently: true });
  g.drawImage(bmp, 0, 0);
  const px = g.getImageData(0, 0, bmp.width, bmp.height).data, rgb = new Uint8Array(bmp.width * bmp.height * 3);
  for (let i = 0, j = 0; i < px.length; i += 4) { rgb[j++] = px[i]; rgb[j++] = px[i + 1]; rgb[j++] = px[i + 2]; }
  const n = rgb[0] | (rgb[1] << 8) | (rgb[2] << 16) | (rgb[3] << 24);
  return rgb.buffer.slice(4, 4 + n);
}
async function loadModel() {
  const loader = new GLTFLoader();
  loader.register(p => new VRMLoaderPlugin(p));
  const [gltf, m] = await Promise.all([loader.parseAsync(await unpackPng('model.vrm.png'), ''), fetch('motions.json').then(r => r.json())]);
  vrm = gltf.userData.vrm;
  VRMUtils.rotateVRM0(vrm);
  vrm.scene.traverse(o => { o.frustumCulled = false; if (o.isBone) bones.push(o); });
  scene.add(vrm.scene);
  motions = m;
  motion = createMotion(THREE, vrm, motions);
  setPose('stand', 0);
  vrm.update(0);
  for (let i = 0; i < 240; i++) vrm.update(1 / 60);
  const box = new THREE.Box3().setFromObject(vrm.scene);
  addShorts();
  target = box.getCenter(new THREE.Vector3());
  radius = box.getSize(new THREE.Vector3()).y * 0.58 / Math.tan(THREE.MathUtils.degToRad(FOV) / 2);
}
// Navy safety shorts under the dress, as in the coverage renders: colour pass only.
const shorts = [];
function addShorts() {
  const hip = new THREE.Vector3(), knee = new THREE.Vector3(), legTop = new THREE.Vector3();
  vrm.humanoid.getNormalizedBoneNode('hips').getWorldPosition(hip);
  vrm.humanoid.getNormalizedBoneNode('leftLowerLeg').getWorldPosition(knee);
  vrm.humanoid.getNormalizedBoneNode('leftUpperLeg').getWorldPosition(legTop);
  const bottom = legTop.y - (legTop.y - knee.y) * 0.3, top = hip.y + 0.12;
  const meshes = [];
  vrm.scene.traverse(o => { if (o.isSkinnedMesh && /Body_00_SKIN/.test([].concat(o.material)[0].name)) meshes.push(o); });
  for (const o of meshes) {
    const ids = ['hips', 'spine', 'leftUpperLeg', 'rightUpperLeg'].map(n => o.skeleton.bones.indexOf(vrm.humanoid.getRawBoneNode(n)));
    const mat = new THREE.MeshBasicMaterial({ color: 0x1c2056, polygonOffset: true, polygonOffsetFactor: -2, polygonOffsetUnits: -2 });
    mat.onBeforeCompile = sh => {
      const own = ids.map(i => `float(skinIndex.x == ${i}.0) * skinWeight.x + float(skinIndex.y == ${i}.0) * skinWeight.y + float(skinIndex.z == ${i}.0) * skinWeight.z + float(skinIndex.w == ${i}.0) * skinWeight.w`).join(' + ');
      sh.vertexShader = sh.vertexShader.replace('#include <common>', '#include <common>\nvarying float vY;\nvarying float vW;')
        .replace('#include <project_vertex>', `#include <project_vertex>\nvY = (modelMatrix * vec4(position, 1.0)).y;\nvW = ${own};`);
      sh.fragmentShader = sh.fragmentShader.replace('#include <common>', '#include <common>\nvarying float vY;\nvarying float vW;')
        .replace('void main() {', `void main() {\n  if (vW < 0.5 || vY < ${bottom.toFixed(4)} || vY > ${top.toFixed(4)}) discard;`);
    };
    const s = new THREE.SkinnedMesh(o.geometry, mat);
    s.bind(o.skeleton, o.bindMatrix);
    s.frustumCulled = false;
    o.parent.add(s);
    shorts.push(s);
  }
}
const bone = n => vrm.humanoid.getNormalizedBoneNode(n);
function setPose(name, t) {
  if (motion?.apply(name, t)) return;
  const d = THREE.MathUtils.degToRad, set = (n, x, y, z) => { const b = bone(n); if (b) b.rotation.set(x, y, z); };
  vrm.humanoid.resetNormalizedPose();   // the training pose: arms relaxed down from the T-pose
  set('leftUpperArm', 0, 0, -d(ARM_DROP)); set('rightUpperArm', 0, 0, d(ARM_DROP));
  set('leftLowerArm', 0, 0, -0.15); set('rightLowerArm', 0, 0, 0.15);
}
function assignParts(names) {
  vrm.scene.traverse(o => {
    if (!o.isMesh) return;
    o.userData.part = Math.max(0, names.indexOf([].concat(o.material)[0].name.replace(' (Instance)', '')));
    o.onBeforeRender = (r, s, c, g, mat) => { if (mat.uniforms?.part) { mat.uniforms.part.value = o.userData.part; mat.uniformsNeedUpdate = true; } };
  });
}

// ---------- G-buffer: five side-by-side tiles in the coverage renders' 8-bit encodings ----------
const gbufVert = `#include <common>
  #include <uv_pars_vertex>
  #include <skinning_pars_vertex>
  varying vec3 vNormal; varying vec2 vUv0; varying float vDepth;
  void main() {
    #include <uv_vertex>
    #include <beginnormal_vertex>
    #include <skinbase_vertex>
    #include <skinnormal_vertex>
    #include <defaultnormal_vertex>
    #include <begin_vertex>
    #include <skinning_vertex>
    #include <project_vertex>
    vNormal = normalize(transformedNormal); vUv0 = uv; vDepth = -mvPosition.z;
  }`;
const normalMat = new THREE.ShaderMaterial({ vertexShader: gbufVert, side: THREE.DoubleSide,
  fragmentShader: `varying vec3 vNormal; varying vec2 vUv0; varying float vDepth;
    void main() { vec3 n = normalize(vNormal) * (gl_FrontFacing ? 1.0 : -1.0); gl_FragColor = vec4(n * 0.5 + 0.5, 1.0); }` });
const depthMat = new THREE.ShaderMaterial({ vertexShader: gbufVert, side: THREE.DoubleSide, uniforms: { near: { value: 0 }, far: { value: 1 } },
  fragmentShader: `uniform float near, far; varying vec3 vNormal; varying vec2 vUv0; varying float vDepth;
    void main() { float d = 1.0 - clamp((vDepth - near) / (far - near), 0.0, 1.0); gl_FragColor = vec4(vec3(d), 1.0); }` });
const uvSplit = which => new THREE.ShaderMaterial({ vertexShader: gbufVert, side: THREE.DoubleSide, uniforms: { part: { value: 0 } },
  fragmentShader: `uniform float part; varying vec3 vNormal; varying vec2 vUv0; varying float vDepth;
    vec2 split(float x) { x = fract(x) * 255.0; return vec2(floor(x) / 255.0, fract(x)); }
    void main() {
      vec2 u = split(vUv0.x), v = split(vUv0.y);
      gl_FragColor = ${which === 'a' ? 'vec4(u.x, u.y, v.x, 1.0)' : 'vec4(v.y, part / 255.0, 1.0, 1.0)'};
    }` });
const PASSES = [[new THREE.Color(GREEN), null], [new THREE.Color(0), normalMat], [new THREE.Color(0), depthMat], [new THREE.Color(0), uvSplit('a')], [new THREE.Color(0), uvSplit('b')]];

const cam = { yaw: 0, pitch: 5 }, vel = { yaw: 0, pitch: 0 };
function placeCamera() {
  const y = THREE.MathUtils.degToRad(cam.yaw), p = THREE.MathUtils.degToRad(cam.pitch);
  camera.position.set(target.x + radius * Math.cos(p) * Math.sin(y), target.y + radius * Math.sin(p), target.z + radius * Math.cos(p) * Math.cos(y));
  camera.lookAt(target);
  camera.updateMatrixWorld();
}
// The tiles, drawn only inside the crop [x0, y0, x1, y1] (network pixels, top-down).
function renderTiles(crop) {
  depthMat.uniforms.near.value = radius - 0.8; depthMat.uniforms.far.value = radius + 0.8;
  const [x0, y0, x1, y1] = crop;
  renderer.setScissorTest(true);
  PASSES.forEach(([bg, mat], k) => {
    for (const m of shorts) m.visible = !mat;
    renderer.setViewport(k * NW, 0, NW, NH); renderer.setScissor(k * NW + x0, NH - y1, x1 - x0, y1 - y0);
    scene.background = bg; scene.overrideMaterial = mat;
    renderer.render(scene, camera);
  });
  scene.overrideMaterial = null;
  for (const m of shorts) m.visible = true;
  renderer.setScissorTest(false);
}
// Her box on screen from the bones, padded past the silhouette (index.html's cropBox), snapped to 16.
const v3 = new THREE.Vector3();
let lastCrop = null;
function cropBox() {
  let x0 = 1, y0 = 1, x1 = -1, y1 = -1;
  for (const b of bones) {
    b.getWorldPosition(v3).project(camera);
    x0 = Math.min(x0, v3.x); x1 = Math.max(x1, v3.x); y0 = Math.min(y0, v3.y); y1 = Math.max(y1, v3.y);
  }
  const px = x => (x * 0.5 + 0.5) * NW, py = y => (0.5 - y * 0.5) * NH;
  let box = [px(x0) - 44 - CROP_PAD, py(y1) - 64 - CROP_PAD, px(x1) + 44 + CROP_PAD, py(y0) + 32 + CROP_PAD];
  const now = box;
  if (lastCrop) box = [Math.min(box[0], lastCrop[0]), Math.min(box[1], lastCrop[1]), Math.max(box[2], lastCrop[2]), Math.max(box[3], lastCrop[3])];
  lastCrop = now;
  if (!box.every(Number.isFinite)) { lastCrop = null; return [0, 0, NW, NH]; }
  return [Math.max(0, Math.floor(box[0] / 16) * 16), Math.max(0, Math.floor(box[1] / 16) * 16),
    Math.min(NW, Math.ceil(box[2] / 16) * 16), Math.min(NH, Math.ceil(box[3] / 16) * 16)];
}

// ---------- display: the drawing (NW x NH, straight alpha) over the stage gradient ----------
const net = document.createElement('canvas');
net.width = NW; net.height = NH;
const netCtx = net.getContext('2d');
const zoom = { z: 1, tx: 0, ty: 0 };   // magnification and shift (CSS pixels) of the fitted frame
let fps = 0, lastShown = 0, raw = false;
function css(n) { return getComputedStyle(document.documentElement).getPropertyValue(n).trim(); }
// Where the frame goes on the canvas: fit her height (a portrait phone shows the middle of the wide
// frame), then the pinch zoom. [x, y, w, h] in canvas pixels, top-down.
function frameBox() {
  const dpr = Math.min(devicePixelRatio || 1, 2), r = stage.getBoundingClientRect();
  const W = Math.round(r.width * dpr), H = Math.round(r.height * dpr);
  if (view.width !== W || view.height !== H) { view.width = W; view.height = H; }
  const s = Math.min(H / NH, W / (NW * 0.62)) * zoom.z, w = NW * s, h = NH * s;
  return { W, H, box: [(W - w) / 2 + zoom.tx * dpr, (H - h) / 2 + zoom.ty * dpr, w, h] };
}
const rgbOf = n => { const c = new THREE.Color().setStyle(css(n), THREE.LinearSRGBColorSpace); return [c.r, c.g, c.b]; };
function glView(extra = {}) { return { ...frameBox(), top: rgbOf('--stage-top'), bottom: rgbOf('--stage-bottom'), raw, ...extra }; }
function paint() {
  if (ENGINE === 'gpu') { if (gls) gls.frame({ pitch: THREE.MathUtils.degToRad(cam.pitch), view: glView({ showOnly: true }) }); return; }
  const { W, H, box } = frameBox();
  const g = ctx.createLinearGradient(0, 0, 0, H);
  g.addColorStop(0, css('--stage-top')); g.addColorStop(1, css('--stage-bottom'));
  ctx.fillStyle = g; ctx.fillRect(0, 0, W, H);
  ctx.imageSmoothingEnabled = true;
  ctx.drawImage(net, ...box);
}
function show(rgba, crop) {
  netCtx.clearRect(0, 0, NW, NH);
  netCtx.putImageData(new ImageData(rgba, crop[2] - crop[0], crop[3] - crop[1]), crop[0], crop[1]);
  paint();
}

// ---------- VTuber: head and eyes follow the pointer, blinks, lip-sync (microphone or speech) ----------
const face = { follow: false, ndc: null, yaw: 0, pitch: 0, vy: 0, vp: 0, blinkAt: performance.now() + 2500, mic: null, speak: null, mouth: { aa: 0, ih: 0, ou: 0, ee: 0, oh: 0 } };
const lookTarget = new THREE.Object3D(), headPos = new THREE.Vector3(), ray = new THREE.Raycaster(), plane = new THREE.Plane(), camDir = new THREE.Vector3();
const qa = new THREE.Quaternion(), ea = new THREE.Euler();
// Canvas position (CSS pixels) -> the network frame's NDC, through the same box the frame is drawn in.
function pointerNdc(e) {
  const dpr = Math.min(devicePixelRatio || 1, 2), r = stage.getBoundingClientRect(), { box } = frameBox();
  const fx = ((e.clientX - r.left) * dpr - box[0]) / box[2], fy = ((e.clientY - r.top) * dpr - box[1]) / box[3];
  return new THREE.Vector2(fx * 2 - 1, 1 - fy * 2);
}
// After the pose is set, before vrm.update: turn neck and head toward the pointer (eased), aim the eyes,
// blink now and then, and shape the mouth. Returns whether anything is still moving.
function applyFace(dt) {
  const now = performance.now();
  let ty = 0, tp = 0;
  if (face.follow && face.ndc) {
    bone('head').getWorldPosition(headPos);
    camera.getWorldDirection(camDir);
    plane.setFromNormalAndCoplanarPoint(camDir, headPos);
    ray.setFromCamera(face.ndc, camera);
    if (ray.ray.intersectPlane(plane, lookTarget.position)) {
      const d = lookTarget.position.clone().sub(headPos);
      ty = Math.max(-0.9, Math.min(0.9, Math.atan2(d.x, d.z)));
      tp = Math.max(-0.5, Math.min(0.5, Math.atan2(d.y, Math.hypot(d.x, d.z))));
      if (Math.abs(Math.atan2(d.x, d.z)) > 2.3) ty = tp = 0;   // pointer behind her: look ahead
    }
  }
  // A critically damped spring (settles in about a second, no snap at either end); the eyes lead it.
  const w = 4.2, h = Math.min(dt, 0.05);
  face.vy += (w * w * (ty - face.yaw) - 2 * w * face.vy) * h; face.yaw += face.vy * h;
  face.vp += (w * w * (tp - face.pitch) - 2 * w * face.vp) * h; face.pitch += face.vp * h;
  // The turn shared up the body, from the spine to the head, with a lean: looking aside, the upper body
  // tilts toward that side a little and the head cocks the other way.
  for (const [n, sy, sp, roll] of [['spine', 0.12, 0.08, -0.06], ['chest', 0.16, 0.12, -0.05], ['upperChest', 0.12, 0.1, -0.03],
                                   ['neck', 0.22, 0.28, 0], ['head', 0.38, 0.42, 0.16]]) {
    const b = bone(n); if (!b) continue;
    b.quaternion.multiply(qa.setFromEuler(ea.set(-face.pitch * sp, face.yaw * sy, face.yaw * roll, 'YXZ')));
  }
  if (!(face.follow && face.ndc)) { bone('head').getWorldPosition(lookTarget.position); lookTarget.position.z += 2; }   // straight ahead
  if (vrm.lookAt) vrm.lookAt.target = lookTarget;
  const em = vrm.expressionManager;
  // blink: closing and opening over 160 ms, every 2-6 s
  const bt = now - face.blinkAt;
  if (bt > 160) face.blinkAt = now + 2000 + Math.random() * 4000;
  em?.setValue('blink', bt > 0 && bt < 160 ? Math.sin(Math.PI * bt / 160) : 0);
  // mouth: the microphone or the speech, eased
  const want = { aa: 0, ih: 0, ou: 0, ee: 0, oh: 0 };
  if (face.mic) Object.assign(want, micVowels());
  else if (face.speak) Object.assign(want, speechVowels(now));
  for (const v in want) { face.mouth[v] += (want[v] - face.mouth[v]) * Math.min(1, dt * 18); em?.setValue(v, face.mouth[v]); }
  const moving = Math.abs(ty - face.yaw) > 0.002 || Math.abs(tp - face.pitch) > 0.002 || Math.abs(face.vy) + Math.abs(face.vp) > 0.002 || (bt > -40 && bt < 200)
    || Object.values(face.mouth).some(x => x > 0.01) || !!face.mic || !!face.speak;
  return moving;
}
// Microphone: loudness opens the mouth; where the energy sits picks the vowel (dark: ou/oh, bright: ee/ih).
function micVowels() {
  const { an, td, fd, sr } = face.mic;
  an.getFloatTimeDomainData(td); an.getFloatFrequencyData(fd);
  let e = 0; for (const x of td) e += x * x;
  const open = Math.max(0, Math.min(1, (Math.sqrt(e / td.length) - 0.015) * 14));
  const band = (a, b) => { let s = 0; for (let i = Math.floor(a / sr * 2 * fd.length); i < Math.min(fd.length, b / sr * 2 * fd.length); i++) s += 10 ** (fd[i] / 10); return s; };
  const lo = band(250, 800), mid = band(800, 1600), hi = band(1600, 3200), all = lo + mid + hi + 1e-12;
  return { aa: open * mid / all * 1.6, oh: open * lo / all * 1.2, ou: open * lo / all * 0.5, ee: open * hi / all * 1.2, ih: open * hi / all * 0.6 };
}
async function startMic() {
  const stream = await navigator.mediaDevices.getUserMedia({ audio: { echoCancellation: true, noiseSuppression: true } });
  const ac = new (window.AudioContext || window.webkitAudioContext)();
  await ac.resume();
  const an = ac.createAnalyser(); an.fftSize = 1024; an.smoothingTimeConstant = 0.5;
  ac.createMediaStreamSource(stream).connect(an);
  face.mic = { ac, an, stream, td: new Float32Array(an.fftSize), fd: new Float32Array(an.frequencyBinCount), sr: ac.sampleRate };
}
function stopMic() { if (!face.mic) return; face.mic.stream.getTracks().forEach(t => t.stop()); face.mic.ac.close(); face.mic = null; }
// Speech: the browser's voice says the line; the mouth runs through the text's vowels at about 11 letters
// a second, re-aligned at each word the voice reports.
const VOWEL = { a: 'aa', i: 'ih', y: 'ih', u: 'ou', w: 'ou', e: 'ee', o: 'oh' };
function speechVowels(now) {
  const s = face.speak, i = Math.min(s.text.length - 1, s.at + Math.floor((now - s.since) / 90));
  const v = VOWEL[s.text[i]?.toLowerCase()];
  return v ? { [v]: 0.9 } : /[a-z]/i.test(s.text[i] || '') ? { aa: 0.15 } : {};
}
window.debugMouth = text => { face.speak = { text, at: 0, since: performance.now() }; dirty = true; };   // for checks: speech without a voice
function say(text) {
  if (!('speechSynthesis' in window) || !text.trim()) return;
  speechSynthesis.cancel();
  const u = new SpeechSynthesisUtterance(text);
  u.pitch = 1.35; u.rate = 1.05;
  const v = speechSynthesis.getVoices().find(v => /female|samantha|kyoko|zira|aria|jenny/i.test(v.name) && v.lang.startsWith('en'));
  if (v) u.voice = v;
  u.onstart = () => { face.speak = { text, at: 0, since: performance.now() }; dirty = true; };
  u.onboundary = e => { if (face.speak) { face.speak.at = e.charIndex; face.speak.since = performance.now(); } };
  u.onend = u.onerror = () => { face.speak = null; };
  speechSynthesis.speak(u);
}

// ---------- one frame: G-buffer, network, show ----------
let shader = null, gls = null, tiles = null, fence = null, gpuMs = null;
const GL_PASSES = () => PASSES.map(([bg, mat]) => [bg, mat, () => { for (const m of shorts) m.visible = !mat; }]);
let faceMoving = false;
function frameOnce(t) {
  setPose(pose, t);
  faceMoving = applyFace(Math.min(0.05, dtLast));
  vrm.update(animated() ? Math.min(0.05, dtLast) : 0.0001);   // a tiny step so expressions and gaze apply when still
  placeCamera();
  const crop = raw ? [0, 0, NW, NH] : cropBox();
  if (gls) {   // GPU: no readback; a fence per frame keeps the GPU from queueing frames behind it
    depthMat.uniforms.near.value = radius - 0.8; depthMat.uniforms.far.value = radius + 0.8;
    gls.renderTiles(scene, camera, GL_PASSES(), crop);
    for (const m of shorts) m.visible = true;
    gls.frame({ pitch: THREE.MathUtils.degToRad(cam.pitch), view: glView() });
    fence = gl.fenceSync(gl.SYNC_GPU_COMMANDS_COMPLETE, 0); gl.flush();
    return Promise.resolve();
  }
  renderTiles(crop);
  const [x0, y0, x1, y1] = crop, w = x1 - x0, h = y1 - y0, n = w * h * 4;
  for (let k = 0; k < 5; k++) gl.readPixels(k * NW + x0, NH - y1, w, h, gl.RGBA, gl.UNSIGNED_BYTE, tiles.subarray(k * n, (k + 1) * n));
  if (raw) {   // the raw render: the colour tile, green keyed out
    const img = new Uint8ClampedArray(n);
    for (let y = 0; y < h; y++) for (let x = 0; x < w; x++) {
      const s = ((h - 1 - y) * w + x) * 4, d = (y * w + x) * 4, r = tiles[s], g = tiles[s + 1], b = tiles[s + 2];
      img[d] = r; img[d + 1] = g; img[d + 2] = b; img[d + 3] = g - Math.max(r, b) > 64 ? 0 : 255;
    }
    show(img, crop);
    return Promise.resolve();
  }
  return shader.frame({ tiles: tiles.subarray(0, 5 * n), w, h, pitch: THREE.MathUtils.degToRad(cam.pitch) }).then(rgba => show(rgba, crop));
}

// ---------- input: drag to orbit, pinch to zoom, double-tap to reset ----------
const pts = new Map();
let dirty = true, pinch = null, lastTap = 0;
stage.addEventListener('pointerdown', e => {
  stage.setPointerCapture(e.pointerId); pts.set(e.pointerId, [e.clientX, e.clientY]);
  if (pts.size === 2) { const [a, b] = [...pts.values()]; pinch = { d: Math.hypot(a[0] - b[0], a[1] - b[1]), m: [(a[0] + b[0]) / 2, (a[1] + b[1]) / 2] }; }
  if (pts.size === 1) { const now = performance.now(); if (now - lastTap < 300) { zoom.z = 1; zoom.tx = zoom.ty = 0; paint(); } lastTap = now; }
});
stage.addEventListener('pointermove', e => {
  const p = pts.get(e.pointerId); if (!p) return;
  const dx = e.clientX - p[0], dy = e.clientY - p[1]; pts.set(e.pointerId, [e.clientX, e.clientY]);
  if (pts.size === 1) {
    if (face.follow) { face.ndc = pointerNdc(e); dirty = true; return; }
    vel.yaw = -dx * 0.45; vel.pitch = dy * 0.3; cam.yaw += vel.yaw; cam.pitch += vel.pitch; dirty = true; return;
  }
  if (pts.size === 2 && pinch) {
    const [a, b] = [...pts.values()], d = Math.hypot(a[0] - b[0], a[1] - b[1]), m = [(a[0] + b[0]) / 2, (a[1] + b[1]) / 2];
    const r = stage.getBoundingClientRect(), cx = m[0] - r.left - r.width / 2, cy = m[1] - r.top - r.height / 2;
    const z = Math.min(4, Math.max(0.6, zoom.z * d / Math.max(1, pinch.d))), k = z / zoom.z;
    zoom.tx = cx - (cx - zoom.tx) * k + (m[0] - pinch.m[0]); zoom.ty = cy - (cy - zoom.ty) * k + (m[1] - pinch.m[1]); zoom.z = z;
    pinch = { d, m }; vel.yaw = vel.pitch = 0; paint();
  }
});
const up = e => { pts.delete(e.pointerId); if (pts.size < 2) pinch = null; };
// Follow mode with a mouse: she watches it without a button held; a touch sets the point it moves to.
stage.addEventListener('pointermove', e => { if (face.follow && !pts.size && e.pointerType === 'mouse') { face.ndc = pointerNdc(e); dirty = true; } });
stage.addEventListener('pointerdown', e => { if (face.follow) { face.ndc = pointerNdc(e); dirty = true; } });
['pointerup', 'pointercancel', 'lostpointercapture'].forEach(n => stage.addEventListener(n, up));
stage.addEventListener('wheel', e => {   // desktop: the wheel zooms about the cursor
  e.preventDefault();
  const r = stage.getBoundingClientRect(), cx = e.clientX - r.left - r.width / 2, cy = e.clientY - r.top - r.height / 2;
  const z = Math.min(4, Math.max(0.6, zoom.z * Math.exp(-e.deltaY * 0.0015))), k = z / zoom.z;
  zoom.tx = cx - (cx - zoom.tx) * k; zoom.ty = cy - (cy - zoom.ty) * k; zoom.z = z; paint();
}, { passive: false });
addEventListener('resize', () => paint());
matchMedia('(prefers-color-scheme: dark)').addEventListener('change', () => paint());

// ---------- poses and the loop ----------
const CLIPS = { bye: 'Bye', byebye: 'Bye-bye', bow: 'Bow', guide: 'This way', walk: 'Walk', run: 'Run', dance: 'Dance' };
let pose = 'stand', poseStart = performance.now(), dtLast = 0, lastT = performance.now();
const animated = () => pose !== 'stand';
const press = (sel, el) => document.querySelectorAll(sel).forEach(b => b.setAttribute('aria-pressed', String(b === el)));
const wirePose = b => b.onclick = () => { pose = b.dataset.pose; poseStart = performance.now(); press('[data-pose]', b); dirty = true; };
document.getElementById('m-raw').onclick = e => { raw = !raw; e.currentTarget.setAttribute('aria-pressed', String(raw)); dirty = true; };
document.getElementById('v-follow').onclick = e => {
  face.follow = !face.follow; if (!face.follow) face.ndc = null;
  e.currentTarget.setAttribute('aria-pressed', String(face.follow)); dirty = true;
};
document.getElementById('v-mic').onclick = async e => {
  const b = e.currentTarget;
  if (face.mic) { stopMic(); b.setAttribute('aria-pressed', 'false'); return; }
  try { await startMic(); b.setAttribute('aria-pressed', 'true'); dirty = true; }
  catch (err) { readout.textContent = `microphone unavailable: ${err.message}`; }
};
document.getElementById('v-speak').onclick = e => {
  const f = document.getElementById('say'), on = f.hidden;
  f.hidden = !on; e.currentTarget.setAttribute('aria-pressed', String(on));
  if (on) document.getElementById('say-text').focus();
};
document.getElementById('say').onsubmit = e => { e.preventDefault(); say(document.getElementById('say-text').value); };

function gpuBusy() {
  if (!fence) return false;
  const s = gl.clientWaitSync(fence, 0, 0);
  if (s === gl.TIMEOUT_EXPIRED) return true;
  gl.deleteSync(fence); fence = null;
  return false;
}
function loop(now) {
  requestAnimationFrame(loop);
  if (shader ? shader.busy : gpuBusy()) return;   // one frame in flight: the next starts from the time it's actually drawn
  if (!pts.size && (Math.abs(vel.yaw) > 0.01 || Math.abs(vel.pitch) > 0.01)) { cam.yaw += vel.yaw; cam.pitch += vel.pitch; vel.yaw *= 0.9; vel.pitch *= 0.9; dirty = true; }
  cam.pitch = Math.max(-88, Math.min(88, cam.pitch));
  if (!animated() && !dirty && !faceMoving && performance.now() < face.blinkAt - 20) return;   // still: wake for the next blink
  dtLast = (now - lastT) / 1000; lastT = now; dirty = false;
  const t0 = performance.now();
  frameOnce((now - poseStart) / 1000).then(() => {
    const t1 = performance.now();
    fps = lastShown ? fps * 0.85 + 1000 / Math.max(1, t1 - lastShown) * 0.15 : 0; lastShown = t1;
    readout.textContent = raw ? 'raw render' : gls ? `GPU · WebGL2 fragment shaders · ${fps.toFixed(1)} fps`
      : `CPU · WebAssembly ${shader.relaxed ? 'relaxed ' : ''}SIMD ${shader.kernel} × ${shader.threads} · ${Math.round(t1 - t0)} ms · ${fps.toFixed(1)} fps`;
  }).catch(e => { status.hidden = false; status.textContent = `frame failed: ${e.message}`; console.error(e); });
}

// Engine buttons: switching reloads with the other engine.
const engineHash = e => { const t = location.hash.slice(1).split('-').filter(x => x && x !== 'cpu' && x !== 'gpu'); if (e === 'cpu') t.push('cpu'); return t.join('-'); };
for (const e of ['gpu', 'cpu']) {
  const b = document.getElementById(`e-${e}`);
  b.setAttribute('aria-pressed', String(e === ENGINE));
  b.onclick = () => { if (e !== ENGINE) { location.hash = engineHash(e); location.reload(); } };
}

// For checks (#tight): the GPU's drawing and tiles for one view, base64.
window.debugGpu = (yaw, pitch, poseName = 'stand', t = 0) => {
  cam.yaw = yaw; cam.pitch = pitch; pose = poseName; lastCrop = null;
  setPose(poseName, t); vrm.update(0); placeCamera();
  depthMat.uniforms.near.value = radius - 0.8; depthMat.uniforms.far.value = radius + 0.8;
  gls.renderTiles(scene, camera, GL_PASSES(), [0, 0, NW, NH]);
  for (const m of shorts) m.visible = true;
  gls.frame({ pitch: THREE.MathUtils.degToRad(cam.pitch), view: glView() });
  const { px, tiles } = gls.read();
  const b64 = a => { let s = ''; for (let i = 0; i < a.length; i += 0x8000) s += String.fromCharCode(...a.subarray(i, i + 0x8000)); return btoa(s); };
  return { w: NW, h: NH, px: b64(px), tiles: tiles.map(b64) };
};

try {
  let parts;
  if (ENGINE === 'gpu') {
    try { [gls] = await Promise.all([createGlShader({ THREE, renderer, NW, NH, base: 'nts/' }), loadModel()]); parts = gls.parts; }
    catch (e) { console.warn('GPU engine unavailable, using the CPU one:', e); location.hash = engineHash('cpu'); location.reload(); throw e; }
  } else {
    if (!WebAssembly.validate(new Uint8Array([0, 97, 115, 109, 1, 0, 0, 0, 1, 5, 1, 96, 0, 1, 123, 3, 2, 1, 0, 10, 10, 1, 8, 0, 65, 0, 253, 15, 253, 98, 11])))
      throw new Error('this browser has no WebAssembly SIMD (iOS 16.4 or later, or a current desktop browser)');
    const threads = Math.max(2, Math.min(4, (navigator.hardwareConcurrency || 4) - 1));
    [shader] = await Promise.all([createCpuShader({ base: 'nts/', maxPixels: NW * NH, threads }), loadModel()]);
    tiles = new Uint8Array(5 * NW * NH * 4);
    parts = shader.parts;
  }
  assignParts(parts);
  for (const [k, label] of Object.entries(CLIPS)) if (motions.clips[k]) {
    const b = document.createElement('button');
    b.dataset.pose = k; b.textContent = label; b.setAttribute('aria-pressed', 'false');
    document.getElementById('clip-end').before(b);
  }
  document.querySelectorAll('[data-pose]').forEach(wirePose);
  status.hidden = true;
  window.ready = true;
  requestAnimationFrame(loop);
} catch (e) {
  status.textContent = `Could not start: ${e.message}`;
  console.error(e);
}
</script>
