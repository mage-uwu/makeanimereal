<!doctype html>
<html>
<head>
<meta charset="utf-8">
<style>html,body{margin:0;overflow:hidden}</style>
<script type="importmap">
{ "imports": {
  "three": "/node_modules/three/build/three.module.js",
  "three/addons/": "/node_modules/three/examples/jsm/",
  "@pixiv/three-vrm": "/node_modules/@pixiv/three-vrm/lib/three-vrm.module.js"
} }
</script>
</head>
<body>
<script type="module">
// Headless VRM renderer for the coverage film. Driven by coverage/render-orbit.mjs through
// window.setup() and window.shot().
import * as THREE from 'three';
import { GLTFLoader } from 'three/addons/loaders/GLTFLoader.js';
import { VRMLoaderPlugin, VRMUtils } from '@pixiv/three-vrm';
import { createMotion } from '/coverage/live/motion.js';

let renderer, scene, camera, vrm, target, radius, motion, standPose;
// Linear depth across the character, inverted so nearer is brighter (the video model's convention).
const depthMat = new THREE.ShaderMaterial({
  vertexShader: `#include <common>
    #include <skinning_pars_vertex>
    varying float vDepth;
    void main() {
      #include <skinbase_vertex>
      #include <begin_vertex>
      #include <skinning_vertex>
      #include <project_vertex>
      vDepth = -mvPosition.z;
    }`,
  fragmentShader: `uniform float near, far; varying float vDepth;
    void main() { float d = 1.0 - clamp((vDepth - near) / (far - near), 0.0, 1.0); gl_FragColor = vec4(vec3(d), 1.0); }`,
  uniforms: { near: { value: 0 }, far: { value: 1 } },
  side: THREE.DoubleSide,
});

// G-buffer passes for the learned shader: view-space normal, and surface UV with a part id (which
// material). UV goes out in two 8-bit images (high and low byte per coordinate) to keep 16 bits.
const gbufVert = `#include <common>
  #include <uv_pars_vertex>
  #include <skinning_pars_vertex>
  varying vec3 vNormal; varying vec2 vUv0;
  void main() {
    #include <uv_vertex>
    #include <beginnormal_vertex>
    #include <skinbase_vertex>
    #include <skinnormal_vertex>
    #include <defaultnormal_vertex>
    #include <begin_vertex>
    #include <skinning_vertex>
    #include <project_vertex>
    vNormal = normalize(transformedNormal); vUv0 = uv;
  }`;
const normalMat = new THREE.ShaderMaterial({
  vertexShader: gbufVert,
  fragmentShader: `varying vec3 vNormal; varying vec2 vUv0;
    void main() { vec3 n = normalize(vNormal) * (gl_FrontFacing ? 1.0 : -1.0); gl_FragColor = vec4(n * 0.5 + 0.5, 1.0); }`,
  side: THREE.DoubleSide,
});
const uvMat = which => new THREE.ShaderMaterial({
  vertexShader: gbufVert,
  fragmentShader: `uniform float part; varying vec3 vNormal; varying vec2 vUv0;
    vec2 split(float x) { x = fract(x) * 255.0; return vec2(floor(x) / 255.0, fract(x)); }
    void main() {
      vec2 u = split(vUv0.x), v = split(vUv0.y);
      gl_FragColor = ${which === 'a' ? 'vec4(u.x, u.y, v.x, 1.0)' : 'vec4(v.y, part / 255.0, 1.0, 1.0)'};
    }`,
  uniforms: { part: { value: 0 } },
  side: THREE.DoubleSide,
});
const uvMatA = uvMat('a'), uvMatB = uvMat('b');
const PARTS = [];

// Safety shorts for the views from below: the body is drawn again in the dress's navy over the band
// from mid-thigh to the waist. The dress covers that band from every other angle, so only views
// from under the hem see it (clothing, not underwear).
function addShorts() {
  const hip = new THREE.Vector3(), knee = new THREE.Vector3();
  vrm.humanoid.getNormalizedBoneNode('hips').getWorldPosition(hip);
  vrm.humanoid.getNormalizedBoneNode('leftLowerLeg').getWorldPosition(knee);
  const legTop = new THREE.Vector3();
  vrm.humanoid.getNormalizedBoneNode('leftUpperLeg').getWorldPosition(legTop);
  const bottom = legTop.y - (legTop.y - knee.y) * 0.3, top = hip.y + 0.12;
  vrm.scene.traverse(o => {
    // MToon meshes carry [surface, outline] materials.
    if (!o.isSkinnedMesh || !/Body_00_SKIN/.test([].concat(o.material)[0].name)) return;
    // Only skin the hips and thighs move (not the hands, which hang at the same height).
    const ids = ['hips', 'spine', 'leftUpperLeg', 'rightUpperLeg'].map(n => o.skeleton.bones.indexOf(vrm.humanoid.getRawBoneNode(n)));
    const mat = new THREE.MeshBasicMaterial({ color: 0x1c2056, polygonOffset: true, polygonOffsetFactor: -2, polygonOffsetUnits: -2 });
    mat.onBeforeCompile = sh => {
      const own = ids.map(i => `float(skinIndex.x == ${i}.0) * skinWeight.x + float(skinIndex.y == ${i}.0) * skinWeight.y + float(skinIndex.z == ${i}.0) * skinWeight.z + float(skinIndex.w == ${i}.0) * skinWeight.w`).join(' + ');
      sh.vertexShader = sh.vertexShader.replace('#include <common>', '#include <common>\nvarying float vY;\nvarying float vW;')
        .replace('#include <project_vertex>', `#include <project_vertex>\nvY = (modelMatrix * vec4(position, 1.0)).y;\nvW = ${own};`);
      sh.fragmentShader = sh.fragmentShader.replace('#include <common>', `#include <common>\nvarying float vY;\nvarying float vW;`)
        .replace('void main() {', `void main() {\n  if (vW < 0.5 || vY < ${bottom.toFixed(4)} || vY > ${top.toFixed(4)}) discard;`);
    };
    const shorts = new THREE.SkinnedMesh(o.geometry, mat);
    shorts.bind(o.skeleton, o.bindMatrix);
    shorts.frustumCulled = false;
    shorts.userData.partName = 'Shorts';
    o.parent.add(shorts);
  });
}

window.setup = async ({ model, width, height, fov, background, armDrop, shorts, motions }) => {
  renderer = new THREE.WebGLRenderer({ antialias: true, preserveDrawingBuffer: true });
  renderer.setPixelRatio(1);
  renderer.setSize(width, height);
  renderer.outputColorSpace = THREE.SRGBColorSpace;
  document.body.appendChild(renderer.domElement);

  scene = new THREE.Scene();
  scene.background = new THREE.Color(background);
  scene.add(new THREE.AmbientLight(0xffffff, 1.2));
  const sun = new THREE.DirectionalLight(0xffffff, 2.2);
  sun.position.set(1, 3, 2);
  scene.add(sun);

  const loader = new GLTFLoader();
  loader.register(parser => new VRMLoaderPlugin(parser));
  const gltf = await loader.loadAsync(model);
  vrm = gltf.userData.vrm;
  VRMUtils.rotateVRM0(vrm);
  vrm.scene.traverse(o => { o.frustumCulled = false; });
  scene.add(vrm.scene);
  if (motions) motion = createMotion(THREE, vrm, await (await fetch(motions)).json());

  // Arms down from the T-pose into a relaxed stand; the rest of the body stays as modelled.
  const bone = n => vrm.humanoid.getNormalizedBoneNode(n);
  const drop = THREE.MathUtils.degToRad(armDrop);
  standPose = () => {
    vrm.humanoid.resetNormalizedPose();
    bone('leftUpperArm').rotation.z = -drop;
    bone('rightUpperArm').rotation.z = drop;
    bone('leftLowerArm').rotation.z = -0.15;
    bone('rightLowerArm').rotation.z = 0.15;
  };
  standPose();
  vrm.update(0);
  // Let the spring bones (hair, skirt) settle under gravity before the camera moves.
  for (let i = 0; i < 240; i++) vrm.update(1 / 60);

  const box = new THREE.Box3().setFromObject(vrm.scene);
  target = box.getCenter(new THREE.Vector3());
  const size = box.getSize(new THREE.Vector3());
  if (shorts) addShorts();
  camera = new THREE.PerspectiveCamera(fov, width / height, 0.01, 100);
  // Distance that keeps her whole height (plus a small margin) in frame; at high pitch she only
  // gets shorter on screen, and her width is well inside the portrait frame.
  radius = size.y * 0.58 / Math.tan(THREE.MathUtils.degToRad(fov) / 2);
  return { size: size.toArray(), target: target.toArray(), radius };
};

// Pose her at time t of a mocap clip (coverage/live/motions.json), or back in the stand ('stand').
// The hair and skirt springs run through the second before t, so they hang as they would mid-motion.
window.pose = (clip, t) => {
  if (clip === 'stand' || !motion) { standPose(); vrm.update(0); return; }
  for (let k = 60; k >= 0; k--) { motion.apply(clip, Math.max(0, t - k / 60)); vrm.update(1 / 60); }
};

// Yaw 0 looks at her face; pitch is degrees above the horizon.
// The G-buffer of the current camera (call after shot()).
window.gbuffer = () => {
  if (!PARTS.length) vrm.scene.traverse(o => {
    if (!o.isMesh) return;
    const name = o.userData.partName || [].concat(o.material)[0].name.replace(' (Instance)', '');
    if (!PARTS.includes(name)) PARTS.push(name);
    o.userData.part = PARTS.indexOf(name);
    o.onBeforeRender = (r, sc, cam, geo, mat) => {
      if (mat.uniforms && mat.uniforms.part) { mat.uniforms.part.value = o.userData.part; mat.uniformsNeedUpdate = true; }
    };
  });
  const bg = scene.background, out = {};
  scene.background = new THREE.Color(0x000000);
  for (const [key, mat] of [['normal', normalMat], ['uva', uvMatA], ['uvb', uvMatB]]) {
    scene.overrideMaterial = mat;
    renderer.render(scene, camera);
    out[key] = renderer.domElement.toDataURL('image/png');
  }
  scene.background = bg;
  scene.overrideMaterial = null;
  return { ...out, parts: PARTS };
};

window.shot = (yaw, pitch) => {
  const y = THREE.MathUtils.degToRad(yaw), p = THREE.MathUtils.degToRad(pitch);
  camera.position.set(
    target.x + radius * Math.cos(p) * Math.sin(y),
    target.y + radius * Math.sin(p),
    target.z + radius * Math.cos(p) * Math.cos(y),
  );
  camera.lookAt(target);
  renderer.render(scene, camera);
  const png = renderer.domElement.toDataURL('image/png');
  // Depth pass for the video model's structure control: background black.
  const bg = scene.background;
  scene.background = new THREE.Color(0x000000);
  scene.overrideMaterial = depthMat;
  depthMat.uniforms.near.value = radius - 0.8;
  depthMat.uniforms.far.value = radius + 0.8;
  renderer.render(scene, camera);
  const depth = renderer.domElement.toDataURL('image/png');
  scene.background = bg;
  scene.overrideMaterial = null;
  return {
    png, depth,
    position: camera.position.toArray().map(v => +v.toFixed(5)),
    quaternion: camera.quaternion.toArray().map(v => +v.toFixed(6)),
  };
};
</script>
</body>
</html>
